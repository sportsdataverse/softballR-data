name: update_ncaa_playerbox

# Serialize every workflow in this repo that commits to it. Two runs in flight put
# one of them behind origin and its push is rejected -- and where the git calls
# are swallowed with no rc check, that lands as a GREEN job that published
# nothing. Worked examples: wehoop-wnba-data runs 32192069433 + 32192069566, and
# hoopR-nba-data run 32204419012, all on 2026-08-18/19.
#
# cancel-in-progress is FALSE on purpose -- these runs upload release assets, and
# cancelling mid-upload leaves a tag half-updated. Queue instead.
concurrency:
  group: ${{ github.repository }}-commit
  cancel-in-progress: false

on:
  schedule:
    - cron:  '0 6 * * *'
  workflow_dispatch:

jobs:
  update-playerbox-db:
    runs-on: macOS-latest
    env: 
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - name: Update current season NCAA player box
        run: Rscript get_current_season_ncaa_playerbox.R
      - name: commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Update NCAA Player Box" -a || echo "No changes to commit."
          git push origin main || "No changes to commit."
